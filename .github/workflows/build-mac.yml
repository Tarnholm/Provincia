# Builds the macOS DMG (universal — x64 + arm64) whenever a new GitHub
# release is created by the Windows build pipeline, and uploads the .dmg
# to that same release.
#
# Mac builds can't be cross-compiled from Windows (electron-builder requires
# native macOS), so this runs on macos-latest. Windows is still built locally
# by the dev (`npm run dist:win` with --publish always) which creates the
# release on GitHub; this workflow listens for that event and appends the
# .dmg artifact.
#
# Manual trigger (workflow_dispatch) supported for re-running on a release
# that already exists.

name: build-mac

on:
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer (vite)
        run: npm run build

      # The bundle-data script writes campaign-specific JSON/TGA into public/.
      # On CI we don't have access to user-installed mods, so the build/ dir
      # contains only the committed `public/*` bundles. That's fine — the
      # rendered app reads mod data at runtime from the user's local install.

      - name: Build macOS DMG (universal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code signing — keeps the workflow free of cert management.
          # First-launch will require right-click → Open on the user's Mac.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --publish always
