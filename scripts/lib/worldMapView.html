<!-- The world map viewer, inserted into world-map.html by gen-ris-wiki-html.js (__DATA__ is
     replaced with the region list). Pan by dragging, zoom with the wheel, the buttons or a pinch;
     hover names the region, click opens its page; names show once zoomed in. -->
<style>
.wm-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.3rem 0 .6rem}
.wm-bar button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;cursor:pointer;font:inherit}
.wm-bar button:hover{border-color:var(--acc)}
.wm-bar label{display:flex;gap:.35rem;align-items:center;color:var(--dim);font-size:.9rem;cursor:pointer}
.wm-bar input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;font:inherit;min-width:14rem}
.wm{position:relative;height:74vh;min-height:420px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#1c3f66;cursor:grab;touch-action:none;user-select:none}
.wm.drag{cursor:grabbing}
.wm-in{position:absolute;left:0;top:0;transform-origin:0 0;width:4080px;height:2800px;will-change:transform;--lf:12px}
.wm-in img,.wm-in canvas{position:absolute;left:0;top:0;width:4080px;height:2800px;max-width:none;pointer-events:none}
.wm-in canvas{opacity:.55;display:none}
.wm.owners .wm-in canvas{display:block}
.wm-lab{position:absolute;transform:translate(6px,-50%);white-space:nowrap;color:#faf4e4;font-weight:600;font-size:var(--lf);
 text-shadow:0 0 3px #1c160f;pointer-events:none;display:none}
.wm.names:not(.nonames) .wm-lab.on{display:block}
.wm-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
 padding:.45rem .65rem;font-size:.88rem;line-height:1.45;box-shadow:var(--shadow);display:none;z-index:3;max-width:18rem}
.wm-tip img{width:20px;height:20px;vertical-align:middle;margin-right:.3rem}
.wm-tip b{color:var(--acc)}
</style>
<div class="wm-bar"><button type="button" id="wm-plus" title="Zoom in">+</button><button type="button" id="wm-minus" title="Zoom out">−</button><button type="button" id="wm-fit">Whole map</button><label><input type="checkbox" id="wm-own"> Faction colours</label><label><input type="checkbox" id="wm-names" checked> Settlement names</label><input type="search" id="wm-find" placeholder="Find a settlement or region…" list="wm-list" autocomplete="off"><datalist id="wm-list"></datalist></div>
<div class="wm" id="wm"><div class="wm-in" id="wm-in"><img src="world-map/world.webp" alt="The campaign map" width="4080" height="2800"><canvas id="wm-cv" width="1020" height="700"></canvas></div><div class="wm-tip" id="wm-tip"></div></div>
<img id="wm-ids" src="world-map/ids.png" alt="" hidden>
<script>
(function(){
var DATA = __DATA__;
var WS = 4, MW = 1020, MH = 700;
// Zoom cap: the terrain behind the picture has only two pixels per map pixel, so past about
// 1.4 image pixels per screen pixel the browser only stretches it (reported as blurry).
var MAXS = 1.4;
var box = document.getElementById("wm"), inn = document.getElementById("wm-in"), tip = document.getElementById("wm-tip");
var s = 1, x = 0, y = 0, minS = 0.1, ids = null, labs = [];
function esc(t){ return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function apply(){
  var w = box.clientWidth, h = box.clientHeight;
  s = Math.max(minS, Math.min(MAXS, s));
  x = Math.min(0, Math.max(w - 4080 * s, x)); y = Math.min(0, Math.max(h - 2800 * s, y));
  if (4080 * s < w) x = (w - 4080 * s) / 2;
  if (2800 * s < h) y = (h - 2800 * s) / 2;
  inn.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
  // Names only once close enough to read them without piling up (one map pixel is 4 world
  // pixels, so at 1.1 a settlement is ~4.4 screen pixels per map pixel). One style write
  // sizes every label; setting 1,305 font sizes on each zoom step froze the page.
  box.classList.toggle("names", s >= 1.1);
  inn.style.setProperty("--lf", (12 / s).toFixed(1) + "px");
  // Only the labels inside the view are drawn: 1,305 shadowed labels on a layer several
  // thousand pixels wide stalled the page.
  if (s >= 1.1) {
    var x0 = -x / s, y0 = -y / s, x1 = x0 + w / s, y1 = y0 + h / s;
    labs.forEach(function(l){ var on = l._x >= x0 - 50 && l._x <= x1 && l._y >= y0 - 20 && l._y <= y1 + 20; if (on !== l._on) { l._on = on; l.classList.toggle("on", on); } });
  }
}
function fit(){ minS = Math.min(box.clientWidth / 4080, box.clientHeight / 2800); s = minS; x = 0; y = 0; apply(); }
function zoomAt(f, cx, cy){ var ns = Math.max(minS, Math.min(MAXS, s * f)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); }

// Settlement names, placed on the map, shown once zoomed in.
DATA.forEach(function(d){
  if (!d || d.x == null) return;
  var l = document.createElement("div");
  l.className = "wm-lab"; l.textContent = d.s + (d.cap ? " ★" : "");
  l._x = (d.x + .5) * WS; l._y = (d.y + .5) * WS; l._on = false;
  l.style.left = l._x + "px"; l.style.top = l._y + "px";
  inn.appendChild(l); labs.push(l);
});

// Which region is under a point: ids.png, read once into an array.
var im = document.getElementById("wm-ids");
function loadIds(){
  try {
    var c = document.createElement("canvas"); c.width = MW; c.height = MH;
    var g = c.getContext("2d"); g.drawImage(im, 0, 0);
    var p = g.getImageData(0, 0, MW, MH).data;
    ids = new Int16Array(MW * MH);
    for (var i = 0; i < MW * MH; i++) ids[i] = (p[i * 4] << 8 | p[i * 4 + 1]) - 1;
    paintOwners();
  } catch (e) { ids = null; }
}
if (im.complete && im.naturalWidth) loadIds(); else im.addEventListener("load", loadIds);
function paintOwners(){
  var cv = document.getElementById("wm-cv"), g = cv.getContext("2d"), o = g.createImageData(MW, MH);
  for (var i = 0; i < MW * MH; i++) {
    var d = ids[i] >= 0 ? DATA[ids[i]] : null;
    if (d && d.c) { o.data[i * 4] = d.c[0]; o.data[i * 4 + 1] = d.c[1]; o.data[i * 4 + 2] = d.c[2]; o.data[i * 4 + 3] = 255; }
  }
  g.putImageData(o, 0, 0);
}
function regionAt(cx, cy){
  if (!ids) return null;
  var mx = Math.floor((cx - x) / s / WS), my = Math.floor((cy - y) / s / WS);
  if (mx < 0 || my < 0 || mx >= MW || my >= MH) return null;
  var k = ids[my * MW + mx];
  return k >= 0 ? DATA[k] : null;
}

// Pointer: drag to pan (mouse or one finger), pinch to zoom (two fingers), hover for the card.
var pts = {}, moved = 0;
box.addEventListener("pointerdown", function(e){ box.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = 0; box.classList.add("drag"); });
box.addEventListener("pointermove", function(e){
  var r = box.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top, keys = Object.keys(pts);
  if (keys.length === 2 && pts[e.pointerId]) {
    var a = pts[keys[0]], b = pts[keys[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY }; a = pts[keys[0]]; b = pts[keys[1]];
    var d1 = Math.hypot(a.x - b.x, a.y - b.y);
    if (d0 > 0) zoomAt(d1 / d0, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    moved += 10; return;
  }
  if (pts[e.pointerId]) {
    var p = pts[e.pointerId];
    x += e.clientX - p.x; y += e.clientY - p.y;
    moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    apply(); tip.style.display = "none"; return;
  }
  var d = regionAt(cx, cy);
  if (!d) { tip.style.display = "none"; box.style.cursor = ""; return; }
  tip.innerHTML = "<b>" + esc(d.n) + "</b><br>" + esc(d.s) + (d.cap ? " ★ capital" : "") + "<br>" + (d.sym ? '<img src="' + d.sym + '" alt="">' : "") + esc(d.o);
  tip.style.display = "block"; box.style.cursor = "pointer";
  var tx = cx + 16, ty = cy + 16;
  if (tx + tip.offsetWidth > box.clientWidth) tx = cx - tip.offsetWidth - 12;
  if (ty + tip.offsetHeight > box.clientHeight) ty = cy - tip.offsetHeight - 12;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
});
function up(e){ delete pts[e.pointerId]; if (!Object.keys(pts).length) box.classList.remove("drag"); }
box.addEventListener("pointerup", function(e){
  var r = box.getBoundingClientRect(), wasClick = moved < 6 && Object.keys(pts).length === 1;
  up(e);
  if (wasClick) { var d = regionAt(e.clientX - r.left, e.clientY - r.top); if (d && d.href) location.href = d.href; }
});
box.addEventListener("pointercancel", up);
box.addEventListener("pointerleave", function(){ tip.style.display = "none"; });
box.addEventListener("wheel", function(e){ e.preventDefault(); var r = box.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
document.getElementById("wm-plus").onclick = function(){ zoomAt(1.4, box.clientWidth / 2, box.clientHeight / 2); };
document.getElementById("wm-minus").onclick = function(){ zoomAt(1 / 1.4, box.clientWidth / 2, box.clientHeight / 2); };
document.getElementById("wm-fit").onclick = fit;
document.getElementById("wm-own").onchange = function(){ box.classList.toggle("owners", this.checked); };
document.getElementById("wm-names").onchange = function(){ box.classList.toggle("nonames", !this.checked); };

// Find: pick a settlement or region from the list, and the map flies there.
var dl = document.getElementById("wm-list"), opts = [];
DATA.forEach(function(d){ if (d && d.x != null) { opts.push([d.s, d]); if (d.n !== d.s) opts.push([d.n, d]); } });
opts.sort(function(a, b){ return a[0].localeCompare(b[0]); });
dl.innerHTML = opts.map(function(o){ return '<option value="' + esc(o[0]) + '">'; }).join("");
var findBox = document.getElementById("wm-find");
findBox.addEventListener("keydown", function(e){ if (e.key === "Enter") findBox.dispatchEvent(new Event("change")); });
findBox.addEventListener("change", function(){
  var v = this.value.toLowerCase();
  var hit = opts.find(function(o){ return o[0].toLowerCase() === v; }) || opts.find(function(o){ return o[0].toLowerCase().indexOf(v) === 0; });
  if (!hit) return;
  s = 1.2; x = box.clientWidth / 2 - (hit[1].x + .5) * WS * s; y = box.clientHeight / 2 - (hit[1].y + .5) * WS * s; apply();
});
window.addEventListener("resize", function(){ var whole = s <= minS * 1.001; minS = Math.min(box.clientWidth / 4080, box.clientHeight / 2800); if (whole) fit(); else apply(); });
fit();
})();
</script>
